spring.application.name=producer
server.port = 8090

### Config Database
spring.datasource.url=jdbc:mysql://localhost:3306/car_db
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.mvc.pathmatch.matching-strategy=ant-path-matcher

spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.datasource.hikari.connectionTimeout=30000
spring.datasource.hikari.idleTimeout=600000
spring.datasource.hikari.maxLifetime=1800000
spring.datasource.hikari.maximumPoolSize=20
spring.datasource.hikari.minimumIdle=5

## kafka setting
spring.kafka.producer.bootstrap-servers=localhost:9092
spring.kafka.consumer.bootstrap-servers=localhost:9092
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

## Config kafka
auto.create.topics.enable=true
spring.kafka.topics.local=TOPIC_LOCAL
useKafkaLocalProducer=true


## Max request size
spring.kafka.producer.max-request-size=5242880
spring.kafka.producer.properties.max.request.size=5242880
spring.kafka.properties.message.max.bytes=5242880
spring.kafka.properties.max.partition.fetch.bytes=5242880
spring.kafka.properties.fetch.message.max.bytes=5242880
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.consumer.max-poll-records=1
spring.kafka.consumer.max.poll.interval.ms=1200000