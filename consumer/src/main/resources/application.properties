spring.application.name=consumer-toyota
server.port=8082


useKafkaDealerConsumer=true

spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=manual_immediate

### Config Database
spring.datasource.url=jdbc:mysql://localhost:3306/dealer_toyota
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.mvc.pathmatch.matching-strategy=ant-path-matcher
spring.kafka.topics.local=TOPIC_LOCAL
spring.kafka.consumer.group-id=consumer-group-dealer-toyota
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

spring.kafka.consumer.bootstrap-servers=localhost:9092
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.group-local-data=consumer-group-local-data-toyota

spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.kafka.consumer.max-poll-records=1
spring.kafka.consumer.max.poll.interval.ms=1200000